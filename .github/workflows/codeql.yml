name: CodeQL

# Static analysis (SAST) for the JS/TS surface of the monorepo. Runs on
# every PR touching main and on a weekly schedule so the default branch
# is re-scanned against new CodeQL query versions even when nothing
# landed that week. Findings show up in the Security tab and block merge
# if severity is configured to do so on the repo.
#
# All pins are by SHA — this workflow is itself audited by Scorecard.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # See `version-packages.yml` — required for the bot PR's check-runs.
  workflow_dispatch:
  schedule:
    # Tuesdays 05:30 UTC — off-peak for Maitreya001-AI runners, before
    # the maintainer's working hours, one day after the GitHub Advisory
    # Database's Monday batch so we re-scan against fresh queries.
    - cron: '30 5 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required for CodeQL to write results to the Security tab via SARIF.
      security-events: write
      # Required to fetch private repo contents if this repo goes private.
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` includes all `security-extended` queries
          # plus maintainability / reliability rules — useful for a library
          # where a stray unhandled-promise is itself a correctness bug.
          queries: security-and-quality

      - name: Autobuild
        # CodeQL's JS/TS extractor runs without a build step. Autobuild is
        # a no-op here but kept for parity with multi-language projects.
        uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          category: "/language:${{ matrix.language }}"
